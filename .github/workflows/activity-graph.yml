name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}

          options: >-
            theme=merko&
            bg_color=0d1117&
            color=67cb57&
            title_color=67cb57&
            line=67cb57&
            point=67cb57&
            area_color=67cb57&
            area=true&
            hide_border=true&
            radius=8&
            height=300&
            days=31&
            grid=true&
            custom_title=GitHub%20Activity

          output_path: dist/activity-graph.svg

          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish activity graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
